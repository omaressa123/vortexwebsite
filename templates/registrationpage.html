<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Disabled - Vortex Agent</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="index.html">Vortex Agent</a>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Section -->
    <section class="registration">
        <div class="container">
            <div class="registration-panel">
                <div class="registration-header">
                    <h1>Create Your Account</h1>
                    <p>Join Vortex Agent and start your journey</p>
                </div>

                <!-- Registration Form -->
                <div class="registration-form-wrapper">
                    <form class="registration-form" id="userRegistrationForm">
                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmpassword">Confirm Password</label>
                            <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm your password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                    </form>

                    <div class="registration-footer">
                        <p>Already have an account? <a href="/">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>Navigation</h4>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/backendoverviewpage">Admin Portal</a></li>
                    </ul>
                </div>
                
                <div class="footer-section">
                    <h4>Connect</h4>
                    <ul>
                        <li><a href="https://twitter.com/" target="_blank">Twitter</a></li>
                        <li><a href="https://linkedin.com/" target="_blank">LinkedIn</a></li>
                        <li><a href="https://github.com/" target="_blank">GitHub</a></li>
                    </ul>
                </div>
                
                <div class="footer-section">
                    <h4>Contact</h4>
                    <p><a href="mailto:jockeroika@gmial.com">jocker@website.com</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Vortex Agent. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../static/script.js"></script>
</body>
</html>
