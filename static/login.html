<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vortex Agent</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
        }
        .login-container h2 {
            color: #ffffff;
            margin-bottom: 30px;
        }
        .google-btn {
            display: inline-block;
            background: #4285f4;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .google-btn:hover {
            background: #357ae8;
        }
        .admin-link {
            color: #8b0000;
            text-decoration: none;
            font-size: 14px;
        }
        .admin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to Vortex Agent</h2>
        <a href="/auth/google" class="google-btn">Sign in with Google</a>
        <p><a href="/admin-login" class="admin-link">Admin Portal</a></p>
    </div>
</body>
</html>
